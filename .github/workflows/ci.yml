name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      # With no argument, uv installs the version named in .python-version.
      - name: Install Python
        run: uv python install
      - name: Install dev tools from uv.lock
        run: uv sync --locked
      - name: Frozen acceptance tests unchanged
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'acceptance/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- tests/acceptance; then
            echo "::error::tests/acceptance/ differs from $BASE_REF. Frozen acceptance tests change only in an acceptance/* PR approved by Dusten."
            git diff --stat FETCH_HEAD -- tests/acceptance
            exit 1
          fi
      - name: Expat version
        run: uv run --no-project --python 3.14 python -c "import pyexpat; print(pyexpat.EXPAT_VERSION)"
      - name: Lint, types and tests (make check)
        run: make check
      - name: Install check (R42)
        run: make install-check
