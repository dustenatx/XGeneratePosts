name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lint (ruff)
        run: uvx ruff@0.16.10 check .
      - name: Format check (ruff)
        run: uvx ruff@0.16.10 format --check .
      # No lockfile until v3.1: pytest is pinned exactly, and --exclude-newer
      # fixes the date its own dependencies resolve against.
      - name: Expat version
        run: uv run --no-project --python 3.14 python -c "import pyexpat; print(pyexpat.EXPAT_VERSION)"
      - name: Tests (pytest)
        run: uvx --python 3.14 --exclude-newer 2026-10-20 pytest@9.1.1
