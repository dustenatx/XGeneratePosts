name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lint (ruff)
        run: uvx ruff@0.16.10 check .
      - name: Format check (ruff)
        run: uvx ruff@0.16.10 format --check .
      - name: Frozen acceptance tests unchanged
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'acceptance/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git diff --quiet FETCH_HEAD -- tests/acceptance; then
            echo "::error::tests/acceptance/ differs from $BASE_REF. Frozen acceptance tests change only in an acceptance/* PR approved by Dusten."
            git diff --stat FETCH_HEAD -- tests/acceptance
            exit 1
          fi
