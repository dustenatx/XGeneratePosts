name: "Security"

# Security scans on every pull request to master and every push to master,
# copied from QuestVector's security.yml (origin/main 205471e):
#   - gitleaks:  secrets anywhere in the git history.
#   - semgrep:   static analysis with the p/default rule set.
#   - pip-audit: known vulnerabilities in the versions locked in uv.lock.
# gitleaks and Semgrep also upload SARIF to the Security tab. Each scan keeps
# its exit code, so a finding fails the check and blocks the merge.
# CodeQL runs separately through GitHub's default setup, not a workflow file.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        run: >-
          ./gitleaks git --no-banner --redact --exit-code 1
          --report-format sarif --report-path gitleaks.sarif .
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        run: semgrep scan --config p/default --error --metrics=off --sarif-output=semgrep.sarif
      - name: Drop inline-suppressed results
        # Code scanning ignores SARIF suppressions, so approved inline skips would open alerts.
        if: always() && hashFiles('semgrep.sarif') != ''
        run: >-
          jq '.runs[].results |= ((. // []) | map(select(any(.suppressions[]?; .kind == "inSource") | not)))'
          semgrep.sarif > semgrep.tmp && mv semgrep.tmp semgrep.upload.sarif
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('semgrep.upload.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.upload.sarif
          category: semgrep

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
      # With no argument, uv installs the version named in .python-version.
      - name: Install Python
        run: uv python install
      # make audit exports every package in uv.lock with hashes, then runs
      # pip-audit --strict --disable-pip on that list. A new advisory against
      # a locked version can fail a run with no code change.
      - name: Audit locked dependencies (make audit)
        run: make audit
