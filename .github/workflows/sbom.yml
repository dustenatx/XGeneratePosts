name: SBOM

# R46: on every push to master, write the CycloneDX SBOM (make sbom, R43) and
# keep it as a workflow artifact named sbom-<commit SHA> for 90 days. This is
# the interim home until PR 4 attaches the SBOM to each release (R39). Not run
# on pull requests, so it never becomes a PR check.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Each commit gets its own artifact, so a newer push doesn't cancel an older one.
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      # uv export looks for the .python-version interpreter even though it
      # runs no Python, so install it first, as ci.yml does.
      - name: Install Python
        run: uv python install
      - name: Write the SBOM (make sbom)
        run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: build/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
