# Weekly version updates for Python dependencies (uv.lock) and GitHub Actions
# (R44, copied from QuestVector). Security updates are enabled separately in
# the repository settings and arrive as soon as an advisory is published.
# Minor and patch bumps are grouped into one pull request per ecosystem;
# major bumps open their own pull request so each can be reviewed alone.
# A 7-day cooldown waits a week after a release before proposing it, so a
# compromised release has time to be caught and pulled first.
# Not covered: the Semgrep container image and the gitleaks version in
# security.yml are bumped by hand (docs/decisions.md).
version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
