[project]
name = "xgenerateposts"
version = "3.1.0.dev0"
description = "Drafts X and LinkedIn posts from an author profile and a topic chosen at run time."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Standard library only at runtime (v3 R5).
dependencies = []

[project.scripts]
xgp = "xgenerateposts.cli:main"

[build-system]
requires = ["uv_build==0.13.4"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root, so python daily_post.py
# imports it without an install (R30).
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
# A command-line tool: print() is its user interface, in these two modules only.
"xgenerateposts/cli.py" = ["T201"]
"xgenerateposts/storage.py" = ["T201"]
"tests/**" = ["S101"]

[tool.mypy]
files = ["xgenerateposts", "daily_post.py"]
warn_redundant_casts = true  # part of strict, but a global-only option

# R28: strict on the pure-logic modules, which do no I/O. mypy's own
# `strict` can't be set per module, so its flags are listed one by one.
# Default level, not strict: config (environment and the env file), storage
# (files), net, providers, search and publish (network, and the optional
# untyped anthropic and tweepy SDKs), cli (terminal) and the daily_post.py
# shim.
[[tool.mypy.overrides]]
module = [
    "xgenerateposts.author_profile",
    "xgenerateposts.dedup",
    "xgenerateposts.feeds",
    "xgenerateposts.fields",
    "xgenerateposts.prompt",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Optional SDKs, imported lazily only by --provider anthropic and --post; not installed in dev.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "tweepy", "tweepy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
